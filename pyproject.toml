[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-water"
version = "0.1.0"
description = "Reproducible water demand and leakage detection research starter"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<3"]

[project.optional-dependencies]
ml = ["scikit-learn>=1.5,<2", "imbalanced-learn>=0.13,<1"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "smart-water[ml]"]
deep = ["torch>=2.6,<3", "smart-water[ml]"]

[project.scripts]
smart-water = "smart_water.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py311"
